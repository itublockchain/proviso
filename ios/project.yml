name: Proviso
options:
  bundleIdPrefix: com.ethtokyo.proviso
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Proviso:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Proviso
    info:
      path: Proviso/Info.plist
      properties:
        CFBundleDisplayName: Proviso
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: com.ethtokyo.proviso
            CFBundleURLSchemes: [proviso]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ethtokyo.proviso
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
